name: Validate theoremA

# A clean proof build is substantial. Run explicitly from the Actions page.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Clean Lean build, axioms and mutation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install elan and the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Validate source from a clean build
        shell: bash
        run: bash ./scripts/validate.sh --clean
      - name: Retain fresh validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: theoremA-validation-${{ github.run_id }}
          path: audit/local/
          if-no-files-found: warn
          retention-days: 30
